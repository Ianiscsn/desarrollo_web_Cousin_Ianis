<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Tarea 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="page-principal">
    <header class="header">
        <div class="container_info">
            <a th:href="@{/actividad/agregar}" class="contact"><p>Agregar actividad</p></a>
            <span class="separator"></span>
            <a th:href="@{/listados_actividades}" class="contact"><p>Ver listados de actividades</p></a>
            <span class="separator"></span>
            <a th:href="@{/estadisticas}" class="contact"><p>Estadísticas</p></a>
            <span class="separator"></span>
            <a th:href="@{/actividades/realizadas}" class="contact"><p>Actividades realizadas</p></a>
        </div>
    </header>

    <br><br><br><br>

    <div class="content">
        <div class="container_description">
            <p><b>Bienvenido al sitio web de actividades recreativas</b></p>

            <p th:if="${mensaje != null}" style="color:green;">
                <b th:text="${mensaje}"></b>
            </p>
        </div>

        <table class="table" th:if="${actividades != null}">
            <thead>
                <tr>
                    <th>Inicio</th>
                    <th>Término</th>
                    <th>Comuna</th>
                    <th>Sector</th>
                    <th>Tema</th>
                    <th>Foto</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${actividades}">
                    <td th:text="${p.diaHoraInicio}"></td>
                    <td th:text="${p.diaHoraTermino}"></td>
                    <td th:text="${p.comuna.nombre}"></td>
                    <td th:text="${p.sector}"></td>
                    <td>
                        <span th:each="tema,iterStat : ${p.temas}">
                            <span th:text="${tema.tema}"></span><span th:if="${!iterStat.last}">, </span>
                        </span>
                    </td>
                    <td>
                        <img th:if="${p.fotos != null and !p.fotos.isEmpty()}" 
                             th:src="@{/imagen/{filename}(filename=${p.fotos[0].nombreArchivo})}" 
                             alt="" width="100" />
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
