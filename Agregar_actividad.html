<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tarea 1 </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="./style.css">
</head>

<body class="pagina-agregar">
    <div id ="content" class="content">
        <div class="container-form">
            <br>
            <div class="title-transport">
                <b>Agregar Actividad</b>
            </div>
            <br>
            <form class="transport-form" >
                <p> <b>Partie I : ¿Dónde?</b></p>

                <label for="región"> Región :</label>
                <select id="región" name="región">
                    <option value="none">Seleccione una región</option>
                    <option value="arica">Región de Arica y Parinacota</option>
                    <option value="tarapaca">Región de Tarapacá</option>
                    <option value="antofagasta">Región de Antofagasta</option>
                    <option value="atacama">Región de Atacama</option>
                    <option value="coquimbo">Región de Coquimbo</option>
                    <option value="valparaiso">Región de Valparaíso</option>
                    <option value="santiago">Región Metropolitana de Santiago</option>
                    <option value="ohiggins">Región del Libertador General Bernardo O'Higgins</option>
                    <option value="maule">Región del Maule</option>
                    <option value="ñuble">Región de Ñuble</option>
                    <option value="biobio">Región del Biobío</option>
                    <option value="araucania">Región de La Araucanía</option>
                    <option value="losrios">Región de Los Ríos</option>
                    <option value="loslagos">Región de Los Lagos</option>
                    <option value="aysen">Región de Aysén del General Carlos Ibáñez del Campo</option>
                    <option value="magallanes">Región de Magallanes y de la Antártica Chilena</option>
                </select>

                <br>
                
                <label for="comuna"> Comuna :</label>
                <select id="comuna" name="comuna">
                    <option value="none">Seleccione una comuna</option>
                </select>

                <div id="Sector_input" class="trans-input">
                    <input id="sector" name="sector" placeholder="Sector" type="text" maxlength="100" >
                </div>

                <hr>

                <p> <b>Partie II : ¿Quién organiza?</b></p>

                <div id="Nombre_input" class="trans-input">
                    <input id="nombre" name="nombre" placeholder="Nombre" type="text" maxlength="200" required>
                </div>

                <div id="Email_input" class="trans-input">
                    <input id="email" name="email" placeholder="Email" type="email" maxlength="200" required>
                </div>

                <div id="Tel_input" class="trans-input">
                    <input id="tel" name="tel" placeholder="Número de celular (+NNN.NNNNNNNN)" type="tel">
                </div>

                <div class="trans-input-select">
                    <label for="contact"> Contactar por :</label>
                    <select id="contact" name="contact"  multiple size="7">
                        <option value="ninguno">Ninguno</option>
                        <option value="solution1">Whatsapp</option>
                        <option value="solution2">Telegram</option>
                        <option value="solution3">X</option>
                        <option value="solution4">Instagram</option>
                        <option value="solution5">TikTok</option>
                        <option value="solution6">Otra</option>
                    </select>
                </div>

                <div id="id_contact_container" class="trans-input-contact">
                    <input id="id_contact" name="id_contact" placeholder="Id de contacto o URL de red social" type="text" minlength="4" maxlength="50">
                </div>

                <hr>

                <p> <b>Partie III : ¿Cuándo y de qué trata?:</b></p>

                <div id="DateIn_input" class="trans-input-date">
                    <label for="date_in">Inicio : </label>
                    <input id="date_in" name="date_in"  type="datetime-local" required>
                </div>

                <div id="DateTer_input" class="trans-input-date">
                    <label for="date_ter">Término : </label>
                    <input id="date_ter" name="date_ter"  type="datetime-local">
                </div>

                <div id="descripción_input" class="trans-input">
                    <textarea id="descripción" name="descripción" placeholder="Descripción" cols="50" rows="10"></textarea>
                </div>
                
                <div id="tema_input" class="trans-input-tema">
                    <label for="tema"> Tema :</label>
                    <select id="tema" name="tema" multiple>
                        <option value="solution1">Música</option>
                        <option value="solution2">Deporte</option>
                        <option value="solution3">Ciencias</option>
                        <option value="solution4">Religión</option>
                        <option value="solution5">Política</option>
                        <option value="solution6">Tecnología</option>
                        <option value="solution7">Juegos</option>
                        <option value="solution8">Baile</option>
                        <option value="solution9">Comida</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div id="id_contact_container2" class="trans-input-contact">
                    <input id="desc_tema" name="desc_tema" placeholder="Descripción del tema" type="text" minlength="3" maxlength="15">
                </div>

                <div id="file-container" class="trans-input-file">
                    <label for="file">Foto :</label>
                    <input id="file" name="file[]" type="file" required>
                    <button type="button" id="add-photo">
                        Agregar otra foto
                    </button>
                </div>

                <div class="bouton">
                    <button type="button" id="agreg_actividad">
                        Agregar esta actividad
                    </button>

                <br> <br>
                </div>
            </form>          
        </div>
    </div>

    <div id="modalConfirm" class="modal">
        <div class="modal-content">
            <p><b>¿Está seguro que desea agregar esta actividad?</b></p>
            <button id="btnSi">Sí</button>
            <button id="btnNo">No</button>
        </div>
    </div>

    <div id="Confirm" class="confirm">
        <div class="confirm-content">
            <p><b>Hemos recibido su información, muchas gracias y suerte en su actividad !</b></p>
            <a href="index.html" class="contact">
                <p> Pagina principal </p>
            </a>                
        </div>
    </div>

    <script src="conf_formulario.js"></script>
    <script src="auxil_formulario.js"></script>

</body>

</html>
